components:
  schemas:
    UserDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        userName:
          type: string
          maxLength: 100
          minLength: 0
        userEmail:
          type: string
          format: email
          minLength: 1
        userRole:
          type: string
      required:
      - userEmail
      - userName
    TaskDTO:
      type: object
      properties:
        taskId:
          type: integer
          format: int64
        taskTitle:
          type: string
        taskStatus:
          type: string
          enum:
          - TODO
          - IN_PROGRESS
          - DONE
        taskPriority:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        projectId:
          type: integer
          format: int64
        assigneeId:
          type: integer
          format: int64
        dueDate:
          type: string
          format: date
      required:
      - projectId
      - taskTitle
    ProjectDTO:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
        projectName:
          type: string
          minLength: 1
        projectDescription:
          type: string
      required:
      - projectName
    UserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserDTO"
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        lastPage:
          type: boolean
    TaskResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TaskDTO"
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        lastPage:
          type: boolean
    ProjectResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProjectDTO"
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        lastPage:
          type: boolean
