server:
  port: 8087

spring:
  application:
    name: task-tracker
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    spring.jpa.database-platform: org.hibernate.dialect.H2Dialect

task:
  default-priority: MEDIUM
